<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企業知識庫 RAG 系統</title>
  <style>
    /* ── 全局重設 ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #2563eb;
      --primary-d: #1d4ed8;
      --success:   #16a34a;
      --warn:      #d97706;
      --danger:    #dc2626;
      --bg:        #f1f5f9;
      --sidebar:   #1e293b;
      --sidebar-t: #94a3b8;
      --card:      #ffffff;
      --border:    #e2e8f0;
      --text:      #1e293b;
      --text-muted:#64748b;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(0,0,0,.08);
    }

    html, body { height: 100%; font-family: 'Segoe UI', 'Noto Sans TC', sans-serif; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }
    header h1 span { font-size: 1.4rem; }

    #status-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
    }
    .dot.ok  { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .dot.warn{ background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
    .dot.err { background: #f87171; box-shadow: 0 0 6px #f87171; }

    /* ── 主體 ──────────────────────────────────────────── */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 57px);
    }

    /* ── 側欄 ──────────────────────────────────────────── */
    aside {
      width: 280px;
      flex-shrink: 0;
      background: var(--sidebar);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .aside-section {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .aside-section h2 {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--sidebar-t);
      margin-bottom: 10px;
    }

    /* 索引按鈕 */
    #btn-index {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s;
    }
    #btn-index:hover:not(:disabled) { background: var(--primary-d); }
    #btn-index:active:not(:disabled){ transform: scale(.97); }
    #btn-index:disabled { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .spinning .spinner { display: block; }
    .spinning .btn-icon { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 狀態卡片 */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: .83rem;
    }
    .stat-row .label { color: var(--sidebar-t); }
    .stat-row .value { font-weight: 600; }
    .value.ok   { color: #4ade80; }
    .value.err  { color: #f87171; }
    .value.warn { color: #fbbf24; }

    /* PDF 列表 */
    #pdf-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
    }

    #pdf-list h2 {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--sidebar-t);
      margin-bottom: 8px;
      padding-top: 14px;
    }

    .pdf-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: .8rem;
      color: #cbd5e1;
      margin-bottom: 2px;
      transition: background .15s;
    }
    .pdf-item:hover { background: rgba(255,255,255,.05); }
    .pdf-item .icon { flex-shrink: 0; font-size: 1rem; margin-top: 1px; }
    .pdf-item .name { word-break: break-all; line-height: 1.4; }

    /* ── 聊天區 ──────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 歡迎畫面 */
    #welcome {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      max-width: 420px;
    }
    #welcome .welcome-icon { font-size: 4rem; margin-bottom: 12px; }
    #welcome h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
    #welcome p  { font-size: .9rem; line-height: 1.6; }

    /* 訊息泡泡 */
    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: .73rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: .92rem;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 4px;
      white-space: pre-wrap;
    }

    /* 打字游標 */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--primary);
      animation: blink 1s steps(1) infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* 來源卡片 */
    .sources-toggle {
      margin-top: 8px;
      font-size: .78rem;
      color: var(--primary);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
      font-weight: 600;
    }
    .sources-toggle:hover { text-decoration: underline; }
    .sources-toggle .arrow { transition: transform .2s; }
    .sources-toggle.open .arrow { transform: rotate(180deg); }

    .sources-panel {
      display: none;
      margin-top: 8px;
      gap: 8px;
      flex-direction: column;
    }
    .sources-panel.open { display: flex; }

    .source-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .8rem;
    }
    .source-card .src-name {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .source-card .src-score {
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      padding: 1px 7px;
      font-size: .7rem;
      font-weight: 600;
    }
    .source-card .src-text {
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 錯誤訊息 */
    .msg.error .bubble {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--danger);
    }

    /* ── 輸入區 ──────────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 16px 24px;
      background: var(--card);
      border-top: 1px solid var(--border);
      box-shadow: 0 -2px 10px rgba(0,0,0,.04);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 900px;
      margin: 0 auto;
    }

    #question-input {
      flex: 1;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .92rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 120px;
      min-height: 44px;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    #question-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }

    #btn-send {
      width: 48px; height: 44px;
      border-radius: var(--radius);
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .1s;
    }
    #btn-send:hover:not(:disabled) { background: var(--primary-d); }
    #btn-send:active:not(:disabled){ transform: scale(.93); }
    #btn-send:disabled { opacity: .5; cursor: not-allowed; }

    .input-hint {
      font-size: .72rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }

    /* ── Toast 通知 ──────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: .85rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      transform: translateY(80px);
      opacity: 0;
      transition: all .3s ease;
      z-index: 999;
      max-width: 320px;
      pointer-events: none;
    }
    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    #pdf-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <h1><span>🏢</span> 企業知識庫 RAG 系統</h1>
  <div id="status-bar">
    <div class="badge">
      <div class="dot" id="dot-ollama"></div>
      <span id="lbl-ollama">OLLAMA 連線中…</span>
    </div>
    <div class="badge">
      <div class="dot" id="dot-index"></div>
      <span id="lbl-index">索引狀態</span>
    </div>
    <div class="badge">
      📄 <span id="lbl-docs">-</span> 筆資料
    </div>
  </div>
</header>

<!-- ── 主體 ──────────────────────────────────────────────── -->
<div class="main-layout">

  <!-- 側欄 -->
  <aside>
    <div class="aside-section">
      <h2>系統控制</h2>
      <button id="btn-index" onclick="doIndex()">
        <div class="spinner"></div>
        <span class="btn-icon">⚡</span>
        建立 / 重建索引
      </button>
    </div>

    <div class="aside-section">
      <h2>系統狀態</h2>
      <div class="stat-row">
        <span class="label">OLLAMA</span>
        <span class="value" id="stat-ollama">—</span>
      </div>
      <div class="stat-row">
        <span class="label">模型</span>
        <span class="value" id="stat-model">—</span>
      </div>
      <div class="stat-row">
        <span class="label">索引文件數</span>
        <span class="value" id="stat-docs">—</span>
      </div>
      <div class="stat-row">
        <span class="label">PDF 數量</span>
        <span class="value" id="stat-pdfs">—</span>
      </div>
    </div>

    <div id="pdf-list">
      <h2>📚 PDF 文件</h2>
      <div id="pdf-items">載入中…</div>
    </div>
  </aside>

  <!-- 聊天區 -->
  <div class="chat-container">
    <div id="messages">
      <div id="welcome">
        <div class="welcome-icon">💡</div>
        <h2>企業知識庫助理</h2>
        <p>
          請先點擊左側「<strong>建立索引</strong>」按鈕<br>
          讓系統讀取並分析所有 PDF 文件。<br><br>
          完成後，即可在下方輸入問題，<br>
          AI 將根據文件內容為您解答。
        </p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="question-input"
          placeholder="輸入您的問題… (Enter 送出，Shift+Enter 換行)"
          rows="1"
        ></textarea>
        <button id="btn-send" onclick="sendQuestion()" title="送出">➤</button>
      </div>
      <p class="input-hint">⚠ 回答基於已索引的 PDF 文件，請確認索引已建立</p>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div id="toast"></div>

<script>
// ── 全局狀態 ──────────────────────────────────────────────────────────────────
let isStreaming   = false;
let currentBotMsg = null;

// ── 工具函式 ──────────────────────────────────────────────────────────────────
function showToast(msg, type = 'info', duration = 3500) {
  const t = document.getElementById('toast');
  const icons = { info: 'ℹ️', success: '✅', error: '❌', warn: '⚠️' };
  t.textContent = (icons[type] || '') + ' ' + msg;
  t.style.borderLeft = '4px solid ' + {
    info: '#2563eb', success: '#16a34a', error: '#dc2626', warn: '#d97706'
  }[type];
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), duration);
}

function now() {
  return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

// ── 取得系統狀態 ──────────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const res  = await fetch('/api/status');
    const data = await res.json();

    // Header badges
    const dOllama = document.getElementById('dot-ollama');
    const lOllama = document.getElementById('lbl-ollama');
    if (data.ollama_ok) {
      dOllama.className = 'dot ok';
      lOllama.textContent = 'OLLAMA 已連接';
    } else {
      dOllama.className = 'dot err';
      lOllama.textContent = 'OLLAMA 未連接';
    }

    const dIndex = document.getElementById('dot-index');
    const lIndex = document.getElementById('lbl-index');
    if (data.indexed) {
      dIndex.className = 'dot ok';
      lIndex.textContent = '索引完成';
    } else {
      dIndex.className = 'dot warn';
      lIndex.textContent = '尚未索引';
    }

    document.getElementById('lbl-docs').textContent   = data.doc_count ?? '0';

    // 側欄統計
    document.getElementById('stat-ollama').textContent = data.ollama_ok ? '已連接' : '未連接';
    document.getElementById('stat-ollama').className   = 'value ' + (data.ollama_ok ? 'ok' : 'err');
    document.getElementById('stat-model').textContent  = data.ollama_model ?? '—';
    document.getElementById('stat-docs').textContent   = (data.doc_count ?? 0) + ' 筆';
    document.getElementById('stat-docs').className     = 'value ' + (data.indexed ? 'ok' : 'warn');
    document.getElementById('stat-pdfs').textContent   = (data.pdf_count ?? 0) + ' 個';

    // PDF 列表
    const container = document.getElementById('pdf-items');
    if (data.pdf_files && data.pdf_files.length > 0) {
      container.innerHTML = data.pdf_files.map(f => `
        <div class="pdf-item">
          <span class="icon">📄</span>
          <span class="name" title="${f}">${f}</span>
        </div>
      `).join('');
    } else {
      container.innerHTML = '<p style="color:#64748b;font-size:.8rem">未找到 PDF 檔案</p>';
    }
  } catch (e) {
    console.error('載入狀態失敗', e);
  }
}

// ── 建立索引 ──────────────────────────────────────────────────────────────────
async function doIndex() {
  const btn = document.getElementById('btn-index');
  btn.classList.add('spinning');
  btn.disabled = true;
  showToast('正在建立索引，可能需要數分鐘…', 'info', 60000);

  try {
    const res  = await fetch('/api/index', { method: 'POST' });
    const data = await res.json();

    if (data.status === 'success') {
      showToast(data.message, 'success');
    } else {
      showToast(data.message || '索引失敗', 'error');
    }
    await loadStatus();
  } catch (e) {
    showToast('索引請求失敗：' + e.message, 'error');
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

// ── 建立訊息泡泡 ──────────────────────────────────────────────────────────────
function createUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-meta">您 · ${now()}</div>
    <div class="bubble">${escHtml(text)}</div>
  `;
  return div;
}

function createBotBubble() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="msg-meta">🤖 AI 助理 · ${now()}</div>
    <div class="bubble" id="bot-bubble-text"><span class="cursor"></span></div>
    <div id="bot-sources-wrap"></div>
  `;
  return div;
}

function appendSources(sources) {
  const wrap = document.getElementById('bot-sources-wrap');
  if (!wrap || !sources || sources.length === 0) return;

  const toggle = document.createElement('button');
  toggle.className = 'sources-toggle';
  toggle.innerHTML = `📎 查看 ${sources.length} 個參考來源 <span class="arrow">▼</span>`;

  const panel = document.createElement('div');
  panel.className = 'sources-panel';
  panel.innerHTML = sources.map(s => `
    <div class="source-card">
      <div class="src-name">
        <span>📄 ${escHtml(s.source)}</span>
        <span class="src-score">相關度 ${Math.round((s.score || 0) * 100)}%</span>
      </div>
      <div class="src-text">${escHtml(s.excerpt || '')}</div>
    </div>
  `).join('');

  toggle.onclick = () => {
    toggle.classList.toggle('open');
    panel.classList.toggle('open');
  };

  wrap.appendChild(toggle);
  wrap.appendChild(panel);

  // 移除舊 ID，避免衝突
  wrap.removeAttribute('id');
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── 送出問題 ──────────────────────────────────────────────────────────────────
async function sendQuestion() {
  if (isStreaming) return;

  const input    = document.getElementById('question-input');
  const question = input.value.trim();
  if (!question) return;

  hideWelcome();
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('btn-send').disabled = true;

  // 顯示使用者訊息
  const messages = document.getElementById('messages');
  messages.appendChild(createUserBubble(question));

  // 建立 AI 回覆泡泡
  const botMsg = createBotBubble();
  messages.appendChild(botMsg);
  currentBotMsg = botMsg;

  messages.scrollTop = messages.scrollHeight;
  isStreaming = true;

  const textEl = botMsg.querySelector('#bot-bubble-text');
  let   fullText = '';

  try {
    const resp = await fetch('/api/query', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({ question }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();         // 最後一行可能不完整，留待下次

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); }
        catch  { continue; }

        if (evt.type === 'sources') {
          // 來源先存著，等回覆完再顯示
          botMsg._sources = evt.data;

        } else if (evt.type === 'token') {
          fullText += evt.data;
          // 移除游標、更新文字、重新加游標
          textEl.innerHTML = escHtml(fullText) + '<span class="cursor"></span>';
          messages.scrollTop = messages.scrollHeight;

        } else if (evt.type === 'error') {
          textEl.innerHTML = `<span style="color:var(--danger)">${escHtml(evt.data)}</span>`;
          botMsg.classList.add('error');

        } else if (evt.type === 'done') {
          // 移除游標
          textEl.innerHTML = escHtml(fullText);
          // 顯示來源
          if (botMsg._sources) appendSources(botMsg._sources);
        }
      }
    }
  } catch (e) {
    textEl.innerHTML = `<span style="color:var(--danger)">❌ 請求失敗：${escHtml(e.message)}</span>`;
  } finally {
    isStreaming = false;
    document.getElementById('btn-send').disabled = false;
    input.focus();
    messages.scrollTop = messages.scrollHeight;
  }
}

// ── 鍵盤送出 ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('question-input');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  // 自動調整高度
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // 初始化狀態
  loadStatus();
  setInterval(loadStatus, 30000);   // 每 30 秒更新狀態
});
</script>
</body>
</html>
